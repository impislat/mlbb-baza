name: Inspect Roblox place

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract and inspect place file
        shell: bash
        run: |
          mkdir -p /tmp/place inspection/scripts
          7z x Place1.7z -o/tmp/place -y
          FILE="$(find /tmp/place -type f -iname '*.rbxlx' -o -iname '*.rbxl' | head -n 1)"
          if [ -z "$FILE" ]; then
            echo "No .rbxlx or .rbxl file found inside Place1.7z" > inspection/ERROR.txt
            exit 1
          fi
          python3 - "$FILE" <<'PY'
          import sys, os, re, hashlib
          import xml.etree.ElementTree as ET
          src = sys.argv[1]
          root = ET.parse(src).getroot()
          lines = []
          scripts = []
          counts = {}
          def prop_value(props, name):
              if props is None: return ""
              for p in props:
                  if p.attrib.get("name") == name:
                      return "".join(p.itertext()).strip()
              return ""
          def walk(item, parent=""):
              cls = item.attrib.get("class", "Unknown")
              props = item.find("Properties")
              name = prop_value(props, "Name") or "(unnamed)"
              path = parent + "/" + name
              counts[cls] = counts.get(cls, 0) + 1
              lines.append(f"{path} [{cls}]")
              if cls in ("Script", "LocalScript", "ModuleScript"):
                  code = prop_value(props, "Source")
                  if code:
                      safe = re.sub(r"[^A-Za-z0-9_.-]+", "_", path.strip("/"))
                      safe = safe[-150:]
                      filename = f"inspection/scripts/{safe}.lua"
                      os.makedirs(os.path.dirname(filename), exist_ok=True)
                      with open(filename, "w", encoding="utf-8") as f:
                          f.write(f"-- Roblox path: {path}\n-- Class: {cls}\n\n")
                          f.write(code)
                      scripts.append((path, cls, filename, len(code), hashlib.sha256(code.encode()).hexdigest()))
              for child in item.findall("Item"):
                  walk(child, path)
          for item in root.findall("Item"):
              walk(item)
          with open("inspection/HIERARCHY.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          with open("inspection/SUMMARY.txt", "w", encoding="utf-8") as f:
              f.write(f"Input: {os.path.basename(src)}\n")
              f.write(f"Total instances: {sum(counts.values())}\n")
              f.write(f"Scripts extracted: {len(scripts)}\n\n")
              f.write("Instance counts by class:\n")
              for cls, n in sorted(counts.items(), key=lambda x: (-x[1], x[0])):
                  f.write(f"{cls}: {n}\n")
              f.write("\nScripts:\n")
              for path, cls, filename, size, digest in scripts:
                  f.write(f"{path} [{cls}] -> {filename} ({size} chars; sha256 {digest})\n")
          # Keep the generated text small enough for normal GitHub files.
          for dirpath, _, filenames in os.walk("inspection"):
              for fn in filenames:
                  p = os.path.join(dirpath, fn)
                  if os.path.getsize(p) > 5_000_000:
                      os.remove(p)
          print(f"Parsed {sum(counts.values())} instances and extracted {len(scripts)} scripts.")
          PY

      - name: Commit inspection output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inspection
          if git diff --cached --quiet; then
            echo "No inspection changes to commit."
          else
            git commit -m "Add Roblox place inspection report"
            git push
          fi
